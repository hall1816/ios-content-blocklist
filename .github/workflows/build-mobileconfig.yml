name: Validate AdBlock EasyList source

on:
  push:
    branches:
      - main
    paths:
      - "reddit-nsfw-easylist.txt"
      - "scripts/build_easylist.py"
      - ".github/workflows/build-mobileconfig.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate EasyList structure
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path("reddit-nsfw-easylist.txt").read_text(encoding="utf-8")
          rules = {
              m.group(1).lower()
              for m in re.finditer(
                  r"^\|\|reddit\.com/r/([A-Za-z0-9_]+)\^\s*$",
                  source,
                  re.MULTILINE,
              )
          }
          assert len(rules) > 500, len(rules)
          print(f"Validated {len(rules)} EasyList rules")
          PY
